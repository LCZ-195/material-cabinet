/* Material Cabinet Dashboard — colors_and_type.css */
/* Single primary hue: cyan-teal. No secondary/accent brand hue. */

:root {
  /* Primary scale (cyan-teal) */
  --mc-primary-50: #ecfeff;
  --mc-primary-100: #cffafe;
  --mc-primary-200: #a5f3fc;
  --mc-primary-300: #67e8f9;
  --mc-primary-400: #22d3ee;
  --mc-primary-500: #06b6d4;
  --mc-primary-600: #0891b2;
  --mc-primary-700: #0e7490;
  --mc-primary-800: #155e75;
  --mc-primary-900: #164e63;
  --mc-primary-950: #083344;

  /* Neutral scale (slate) */
  --mc-neutral-0: #ffffff;
  --mc-neutral-50: #f8fafc;
  --mc-neutral-100: #f1f5f9;
  --mc-neutral-200: #e2e8f0;
  --mc-neutral-300: #cbd5e1;
  --mc-neutral-400: #94a3b8;
  --mc-neutral-500: #64748b;
  --mc-neutral-600: #475569;
  --mc-neutral-700: #334155;
  --mc-neutral-800: #1e293b;
  --mc-neutral-900: #0f172a;
  --mc-neutral-950: #020617;

  /* Semantic status colors */
  --mc-state-success: #22c55e;
  --mc-state-success-bg: rgba(34, 197, 94, 0.12);
  --mc-state-warning: #f59e0b;
  --mc-state-warning-bg: rgba(245, 158, 11, 0.12);
  --mc-state-error: #ef4444;
  --mc-state-error-bg: rgba(239, 68, 68, 0.12);
  --mc-state-info: #3b82f6;
  --mc-state-info-bg: rgba(59, 130, 246, 0.12);

  /* Semantic aliases */
  --mc-background: #fafafa;
  --mc-foreground: #171717;
  --mc-card: #ffffff;
  --mc-card-foreground: #171717;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #171717;
  --mc-primary: #171717;
  --mc-primary-foreground: #ffffff;
  --mc-muted: #f5f5f5;
  --mc-muted-foreground: #737373;
  --mc-border: #e8e8e8;
  --mc-input: #d4d4d4;
  --mc-ring: #0070f3;
  --mc-radius-small: 4px;
  --mc-radius-medium: 8px;
  --mc-radius-large: 12px;

  /* Surface & depth */
  --mc-surface-elevated: rgba(15, 23, 42, 0.72);
  --mc-surface-hover: rgba(30, 41, 59, 0.6);

  /* Typography */
  --mc-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mc-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", "Consolas", monospace;

  /* Shadows (static <= 0.05 alpha, floating <= 0.18) */
  --mc-shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.05);
  --mc-shadow-md: 0 4px 12px rgba(2, 6, 23, 0.06);
  --mc-shadow-lg: 0 10px 30px rgba(2, 6, 23, 0.10);
  --mc-shadow-floating: 0 18px 50px rgba(2, 6, 23, 0.22);

  /* Spacing scale */
  --mc-space-1: 4px;
  --mc-space-2: 8px;
  --mc-space-3: 12px;
  --mc-space-4: 16px;
  --mc-space-5: 20px;
  --mc-space-6: 24px;
  --mc-space-8: 32px;
  --mc-space-10: 40px;
}

/* Light mode toggle support */
html.light {
  --mc-background: #fafafa;
  --mc-foreground: #171717;
  --mc-card: #ffffff;
  --mc-card-foreground: #171717;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #171717;
  --mc-muted: #f5f5f5;
  --mc-muted-foreground: #737373;
  --mc-border: #e8e8e8;
  --mc-input: #d4d4d4;
  --mc-surface-elevated: #ffffff;
  --mc-surface-hover: #f7f7f7;
  --mc-shadow-sm: none;
  --mc-shadow-md: none;
  --mc-shadow-lg: none;
  --mc-shadow-floating: 0 18px 50px rgba(0, 0, 0, 0.12);
}

body {
  font-family: var(--mc-font-sans);
  background-color: var(--mc-background);
  color: var(--mc-foreground);
}

.font-mono { font-family: var(--mc-font-mono); }

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    .app-shell { display: flex; min-height: 100vh; }
    .app-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .app-main {
      margin-left: 240px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .app-header {
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .app-content {
      flex: 1 1 auto;
      padding: var(--mc-space-6);
    }
    .app-footer {
      position: sticky;
      bottom: 0;
      z-index: 30;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--mc-space-6);
      font-size: 12px;
    }
    .footer-actions {
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-2);
      margin-left: var(--mc-space-5);
    }
    .footer-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background: var(--mc-card);
      color: var(--mc-foreground);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s ease;
    }
    .footer-action:hover {
      background: var(--mc-muted);
    }
    .footer-action:focus-visible {
      outline: 2px solid var(--mc-ring, #0070f3);
      outline-offset: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--mc-space-3);
      padding: var(--mc-space-3) var(--mc-space-4);
      margin: 0 var(--mc-space-3);
      border-radius: var(--mc-radius-medium);
      color: var(--mc-muted-foreground);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover {
      background-color: var(--mc-surface-hover);
      color: var(--mc-foreground);
    }
    .nav-item.active {
      background-color: var(--mc-state-info-bg);
      color: var(--mc-ring);
      font-weight: 500;
    }
    .nav-item.active [data-lucide] {
      color: var(--mc-ring);
    }
    .search-input {
      width: 320px;
      padding-left: 36px;
      padding-right: var(--mc-space-4);
      height: 36px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background-color: var(--mc-muted);
      color: var(--mc-foreground);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--mc-ring);
      box-shadow: 0 0 0 2px var(--mc-state-info-bg);
    }
    .search-input::placeholder {
      color: var(--mc-muted-foreground);
    }
  </style>

                    </tr>
                  </thead>
                  <tbody id="ops-log-tbody">
                    <tr>
                      <td colspan="4" class="px-4 py-6 text-center text-muted-foreground">加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- 底部状态栏 -->
      <footer class="app-footer bg-background border-t border-border text-muted-foreground" role="contentinfo">
        <div class="flex items-center">
          <span class="flex items-center gap-2">
            <i data-lucide="package" class="w-3.5 h-3.5"></i>
            物料收纳柜 v2.16.0
          </span>
          <div class="footer-actions">
            <button type="button" class="footer-action" data-dom-id="footer-check-version"><i data-lucide="refresh-cw" class="w-3 h-3"></i>检查版本</button>
            <button type="button" class="footer-action" data-dom-id="footer-check-inventory"><i data-lucide="cloud-download" class="w-3 h-3"></i>检查库存</button>

        </div>
        <span class="flex items-center gap-2" data-dom-id="footer-refresh-time">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          上次刷新: --
        </span>
      </footer>
    </div>
  </div>

  <script>lucide.createIcons();</script>

    <style id="analytics-status-badges">
      .bg-success\/10 { background-color: var(--mc-state-success-bg); }
      .text-success { color: var(--mc-state-success); }
      .bg-warning\/10 { background-color: var(--mc-state-warning-bg); }
      .text-warning { color: var(--mc-state-warning); }
      .bg-error\/10 { background-color: var(--mc-state-error-bg); }

    .no-scrollbar::-webkit-scrollbar { display: none; }

      mask-size: contain;
      -webkit-mask-repeat: no-repeat;

      background-color: currentColor;
