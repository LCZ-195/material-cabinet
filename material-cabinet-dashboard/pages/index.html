/* Material Cabinet Dashboard — colors_and_type.css */
/* Single primary hue: cyan-teal. No secondary/accent brand hue. */

:root {
  /* Primary scale (cyan-teal) */
  --mc-primary-50: #ecfeff;
  --mc-primary-100: #cffafe;
  --mc-primary-200: #a5f3fc;
  --mc-primary-300: #67e8f9;
  --mc-primary-400: #22d3ee;
  --mc-primary-500: #06b6d4;
  --mc-primary-600: #0891b2;
  --mc-primary-700: #0e7490;
  --mc-primary-800: #155e75;
  --mc-primary-900: #164e63;
  --mc-primary-950: #083344;

  /* Neutral scale (slate) */
  --mc-neutral-0: #ffffff;
  --mc-neutral-50: #f8fafc;
  --mc-neutral-100: #f1f5f9;
  --mc-neutral-200: #e2e8f0;
  --mc-neutral-300: #cbd5e1;
  --mc-neutral-400: #94a3b8;
  --mc-neutral-500: #64748b;
  --mc-neutral-600: #475569;
  --mc-neutral-700: #334155;
  --mc-neutral-800: #1e293b;
  --mc-neutral-900: #0f172a;
  --mc-neutral-950: #020617;

  /* Semantic status colors */
  --mc-state-success: #22c55e;
  --mc-state-success-bg: rgba(34, 197, 94, 0.12);
  --mc-state-warning: #f59e0b;
  --mc-state-warning-bg: rgba(245, 158, 11, 0.12);
  --mc-state-error: #ef4444;
  --mc-state-error-bg: rgba(239, 68, 68, 0.12);
  --mc-state-info: #3b82f6;
  --mc-state-info-bg: rgba(59, 130, 246, 0.12);

  /* Semantic aliases */
  --mc-background: #fafafa;
  --mc-foreground: #171717;
  --mc-card: #ffffff;
  --mc-card-foreground: #171717;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #171717;
  --mc-primary: #171717;
  --mc-primary-foreground: #ffffff;
  --mc-muted: #f5f5f5;
  --mc-muted-foreground: #737373;
  --mc-border: #e8e8e8;
  --mc-input: #d4d4d4;
  --mc-ring: #0070f3;
  --mc-radius-small: 4px;
  --mc-radius-medium: 8px;
  --mc-radius-large: 12px;

  /* Surface & depth */
  --mc-surface-elevated: rgba(15, 23, 42, 0.72);
  --mc-surface-hover: rgba(30, 41, 59, 0.6);

  /* Typography */
  --mc-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mc-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", "Consolas", monospace;

  /* Shadows (static <= 0.05 alpha, floating <= 0.18) */
  --mc-shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.05);
  --mc-shadow-md: 0 4px 12px rgba(2, 6, 23, 0.06);
  --mc-shadow-lg: 0 10px 30px rgba(2, 6, 23, 0.10);
  --mc-shadow-floating: 0 18px 50px rgba(2, 6, 23, 0.22);

  /* Spacing scale */
  --mc-space-1: 4px;
  --mc-space-2: 8px;
  --mc-space-3: 12px;
  --mc-space-4: 16px;
  --mc-space-5: 20px;
  --mc-space-6: 24px;
  --mc-space-8: 32px;
  --mc-space-10: 40px;
}

/* Light mode toggle support */
html.light {
  --mc-background: #fafafa;
  --mc-foreground: #171717;
  --mc-card: #ffffff;
  --mc-card-foreground: #171717;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #171717;
  --mc-muted: #f5f5f5;
  --mc-muted-foreground: #737373;
  --mc-border: #e8e8e8;
  --mc-input: #d4d4d4;
  --mc-surface-elevated: #ffffff;
  --mc-surface-hover: #f7f7f7;
  --mc-shadow-sm: none;
  --mc-shadow-md: none;
  --mc-shadow-lg: none;
  --mc-shadow-floating: 0 18px 50px rgba(0, 0, 0, 0.12);
}

body {
  font-family: var(--mc-font-sans);
  background-color: var(--mc-background);
  color: var(--mc-foreground);
}

.font-mono { font-family: var(--mc-font-mono); }

    </style>

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    .app-shell { display: flex; min-height: 100vh; }
    .app-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 240px;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .app-main {
      margin-left: 240px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .app-header {
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .app-content {
      flex: 1 1 auto;
      padding: var(--mc-space-6);
    }
    .app-footer {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--mc-space-6);
      font-size: 12px;
    }
    .footer-actions {
      display: inline-flex;
      align-items: center;
      gap: var(--mc-space-2);
      margin-left: var(--mc-space-5);
    }
    .footer-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background: var(--mc-card);
      color: var(--mc-foreground);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s ease;
    }
    .footer-action:hover {
      background: var(--mc-muted);
    }
    .footer-action:focus-visible {
      outline: 2px solid var(--mc-ring, #0070f3);
      outline-offset: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--mc-space-3);
      padding: var(--mc-space-3) var(--mc-space-4);
      margin: 0 var(--mc-space-3);
      border-radius: var(--mc-radius-medium);
      color: var(--mc-muted-foreground);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover {
      background-color: var(--mc-surface-hover);
      color: var(--mc-foreground);
    }
    .nav-item.active {
      background-color: var(--mc-primary-50);
      color: var(--mc-primary-700);
      font-weight: 500;
    }
    .nav-item.active [data-lucide] {
      color: var(--mc-primary-600);
    }
    .search-input {
      width: 320px;
      padding-left: 36px;
      padding-right: var(--mc-space-4);
      height: 36px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background-color: var(--mc-muted);
      color: var(--mc-foreground);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--mc-primary-400);
      box-shadow: 0 0 0 2px var(--mc-state-info-bg);
    }
    .search-input::placeholder {
      color: var(--mc-muted-foreground);
    }
    .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
    .overview-slot-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
    .overview-slot { min-width: 0; border: 1px solid var(--mc-border); border-radius: 8px; background: var(--mc-card); overflow: hidden; }
    .overview-slot-number { display: block; padding: 5px 6px 4px; border-bottom: 1px solid var(--mc-border); color: var(--mc-foreground); font: 600 11px/1 var(--mc-font-mono); }
    .overview-bins { display: grid; grid-template-columns: 1fr 1fr; min-height: 34px; }
    .overview-bin { display: flex; align-items: center; justify-content: center; padding: 4px 2px; color: var(--mc-muted-foreground); background: var(--mc-background); font-size: 9px; line-height: 1; }
    .overview-bin + .overview-bin { border-left: 1px solid var(--mc-border); }
    .overview-bin.is-occupied { color: var(--mc-state-info); background: var(--mc-state-info-bg); }
    .overview-bin.is-low { color: var(--mc-state-error); background: var(--mc-state-error-bg); }
    .overview-bin.is-demand-ok { color: var(--mc-state-success); background: var(--mc-state-success-bg); font-weight: 700; font-size: 10px; }
    .overview-bin.is-demand-low { color: var(--mc-state-error); background: var(--mc-state-error-bg); font-weight: 700; font-size: 10px; }
    .overview-bin.is-restock-demand { color: var(--mc-state-info); background: var(--mc-state-info-bg); font-weight: 700; font-size: 10px; }
    .overview-bin.is-demand-done { color: var(--mc-card-foreground); background: var(--mc-card); font-weight: 700; font-size: 10px; }
    @media (max-width: 720px) {
      .app-sidebar { width: 64px; }
      .app-sidebar span, .app-sidebar > div:last-child { display: none; }
      .app-main { margin-left: 64px; }
      .app-content { padding: 16px; }
      .app-header { padding: 0 16px; }
      .search-input { width: min(42vw, 240px); }
      .app-header > div:last-child { gap: 6px; }
      .app-header button { padding-left: 10px; padding-right: 10px; }
    }
    @media (max-width: 520px) {
      .app-header [data-dom-id="btn-import-bom"], .app-header > div:last-child > span, .app-header > div:last-child > div { display: none; }
    }
  </style>

    <!-- 右侧主区域 -->
    <div class="app-main">

      <header class="app-header bg-card border-b border-border flex items-center justify-between px-6" role="banner">
        <div class="flex items-center gap-4">

            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></i>

        <div class="flex items-center gap-3">

      <!-- 页面内容区 -->

              <div id="overview-slot-grid" class="overview-slot-grid" aria-label="80 个实体格位占用概览"></div>
              <div class="flex items-center gap-4 mt-4 text-xs text-muted-foreground">
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-[var(--mc-state-info-bg)] border border-[var(--mc-state-info)]/30"></span> 已占用</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-muted border border-border"></span> 空闲</span>
                <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-[var(--mc-state-error-bg)] border border-[var(--mc-state-error)]/40"></span> 低库存</span>
                <span>左侧为前仓，右侧为后仓</span>
              </div>
            </div>

            <!-- 未匹配物料 + 缺少物料个数 -->
            <div class="lg:col-span-4 bg-card border border-border rounded-lg shadow-sm p-5 flex flex-col">
              <div class="flex items-center justify-between mb-2">
                <h2 class="text-base font-semibold text-foreground">未匹配物料</h2>
                <span class="text-xs text-muted-foreground">最近一次 BOM</span>
              </div>
              <div class="flex items-baseline gap-2 mb-4">
                <span class="text-sm text-muted-foreground">缺少物料个数</span>
                <span class="text-2xl font-semibold font-mono" id="kpi-shortage" style="color: var(--mc-state-warning);">--</span>
              </div>
              <div id="unmatched-list" class="divide-y divide-border text-sm text-muted-foreground flex-1">
                <div class="py-6 text-center">加载中...</div>
              </div>
            </div>
          </div>

          <!-- 第三行：最近操作日志 + 低库存预警 -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <!-- 最近操作日志 -->
            <div class="bg-card border border-border rounded-lg shadow-sm p-5">
              <h2 class="text-base font-semibold text-foreground mb-4">最近操作</h2>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="border-b border-border text-left text-muted-foreground">
                      <th class="pb-3 font-medium">时间</th>
                      <th class="pb-3 font-medium">操作</th>
                      <th class="pb-3 font-medium">结果</th>
                    </tr>
                  </thead>
                  <tbody id="recent-ops" class="divide-y divide-border">
                    <tr>
                      <td colspan="3" class="py-6 text-center text-muted-foreground">加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- 低库存预警 -->
            <div class="bg-card border border-border rounded-lg shadow-sm p-5">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-semibold text-foreground">低库存预警</h2>
                <a href="materials.html" data-dom-id="cta-materials" class="inline-flex items-center gap-1.5 text-sm font-medium text-primary hover:text-primary/80 transition-colors">
                  查看物料
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </a>
              </div>
              <div id="low-stock-list" class="divide-y divide-border text-sm text-muted-foreground">
                <div class="py-6 text-center">加载中...</div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- 底部状态栏 -->
      <footer class="app-footer bg-background border-t border-border text-muted-foreground" role="contentinfo">
        <div class="flex items-center">
          <span class="flex items-center gap-2">
            <i data-lucide="package" class="w-3.5 h-3.5"></i>
            物料收纳柜 v1.15.9
          </span>
          <div class="footer-actions">
            <button type="button" class="footer-action" data-dom-id="footer-check-version"><i data-lucide="refresh-cw" class="w-3 h-3"></i>检查版本</button>
            <button type="button" class="footer-action" data-dom-id="footer-check-inventory"><i data-lucide="cloud-download" class="w-3 h-3"></i>检查库存</button>
          </div>
        </div>
        <span class="flex items-center gap-2" data-dom-id="footer-refresh-time">
          <i data-lucide="clock" class="w-3.5 h-3.5"></i>
          上次刷新: --
        </span>
      </footer>
    </div>
  </div>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [data-icon] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-color: currentColor;
    }
  </style>
  <script>lucide.createIcons();</script>
</body>
</html>
