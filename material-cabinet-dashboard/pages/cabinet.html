  --mc-state-warning: #f59e0b;

  /* Semantic aliases */
  --mc-background: #fafafa;
  --mc-foreground: #171717;

  --mc-popover: #ffffff;

  --mc-radius-medium: 8px;
  --mc-radius-large: 12px;

  --mc-surface-elevated: rgba(15, 23, 42, 0.72);
  --mc-surface-hover: rgba(30, 41, 59, 0.6);

  --mc-font-sans: "Inter", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mc-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", "Consolas", monospace;

  /* Shadows (static <= 0.05 alpha, floating <= 0.18) */
  --mc-shadow-sm: 0 1px 2px rgba(2, 6, 23, 0.05);
  --mc-shadow-md: 0 4px 12px rgba(2, 6, 23, 0.06);
  --mc-shadow-lg: 0 10px 30px rgba(2, 6, 23, 0.10);
  --mc-shadow-floating: 0 18px 50px rgba(2, 6, 23, 0.22);

  /* Spacing scale */
  --mc-space-1: 4px;
  --mc-space-2: 8px;
  --mc-space-3: 12px;
  --mc-space-4: 16px;
  --mc-space-5: 20px;
  --mc-space-6: 24px;
  --mc-space-8: 32px;
  --mc-space-10: 40px;
}

/* Light mode toggle support */
html.light {
  --mc-background: #fafafa;
  --mc-foreground: #171717;
  --mc-card: #ffffff;
  --mc-card-foreground: #171717;
  --mc-popover: #ffffff;
  --mc-popover-foreground: #171717;
  --mc-muted: #f5f5f5;

  --mc-shadow-lg: none;

}

body {
  font-family: var(--mc-font-sans);
  background-color: var(--mc-background);
  color: var(--mc-foreground);
}

.font-mono { font-family: var(--mc-font-mono); }

  <style id="critical-layout">
    .app-shell { display: flex; min-height: 100vh; }

      align-items: center;
      gap: var(--mc-space-2);
      margin-left: var(--mc-space-5);

      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 26px;
      padding: 0 10px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background: var(--mc-card);
      color: var(--mc-foreground);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s ease;
    }
    .footer-action:hover {
      background: var(--mc-muted);
    }
    .footer-action:focus-visible {
      outline: 2px solid var(--mc-ring, #0070f3);
      outline-offset: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: var(--mc-space-3);
      padding: var(--mc-space-3) var(--mc-space-4);
      margin: 0 var(--mc-space-3);
      border-radius: var(--mc-radius-medium);
      color: var(--mc-muted-foreground);
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover {
      background-color: var(--mc-surface-hover);
      color: var(--mc-foreground);
    }
    .nav-item.active {
      background-color: var(--mc-state-info-bg);
      color: var(--mc-ring);
      font-weight: 500;
    }
    .nav-item.active [data-lucide] {
      color: var(--mc-ring);
    }
    .search-input {
      width: 320px;
      padding-left: 36px;
      padding-right: var(--mc-space-4);
      height: 36px;
      border-radius: var(--mc-radius-medium);
      border: 1px solid var(--mc-border);
      background-color: var(--mc-muted);
      color: var(--mc-foreground);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--mc-ring);
      box-shadow: 0 0 0 2px var(--mc-state-info-bg);
    }
    .search-input::placeholder {
      color: var(--mc-muted-foreground);
    }
    .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; }
    .cabinet-slot-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .slot-card { min-width: 0; overflow: hidden; border: 1px solid var(--mc-border); border-radius: 8px; background: var(--mc-card); }
    .slot-card-header { display: flex; align-items: center; justify-content: space-between; height: 31px; padding: 0 9px; border-bottom: 1px solid var(--mc-border); }
    .slot-number { color: var(--mc-foreground); font: 600 12px/1 var(--mc-font-mono); }
